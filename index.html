<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Cuaderno de Citas 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Partículas de fondo -->
  <div class="particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Wrapper del Cuaderno -->
  <div class="notebook-wrapper">
    <div class="notebook">

      <!-- Encuadernación de espiral -->
      <div class="notebook-spine">
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
        <div class="spine-ring"></div>
      </div>

      <!-- PORTADA -->
      <div id="coverPage" class="cover-page">
        <div class="cover-decoration cover-deco-1">✦</div>
        <div class="cover-decoration cover-deco-2">❧</div>
        <div class="cover-decoration cover-deco-3">✦</div>
        <div class="cover-inner">
          <div class="cover-ornament">❦</div>
          <h1 class="cover-title">Nuestro<br>Cuaderno<br><em>de Citas</em></h1>
          <div class="cover-divider"><span></span><span>💌</span><span></span></div>
          <p class="cover-subtitle">Cada momento juntos,<br>guardado para siempre</p>
          <button id="openNotebookBtn" class="btn-open">
            <span>Abrir Cuaderno</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
        </div>
        <div class="cover-footer"> 2026 - Solo para nosotros</div>
      </div>

      <!-- PÁGINAS INTERNAS -->
      <div id="notebookPage" class="notebook-page hidden">

        <!-- Líneas decorativas del papel -->
        <div class="page-lines" aria-hidden="true"></div>

        <header class="inner-header">
          <div class="header-left">
            <span class="header-badge">📖 Recuerdos</span>
          </div>
          <button id="addCitaBtn" class="btn-add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Nueva cita
          </button>
        </header>

        <main id="board" class="board"></main>

        <div id="pagination" class="pagination hidden">
          <button id="prevPageBtn" class="btn-page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Anterior
          </button>
          <span id="pageIndicator" class="page-indicator"></span>
          <button id="nextPageBtn" class="btn-page">
            Siguiente
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📝</div>
          <p>Aún no hay citas guardadas</p>
          <small>¡Añade vuestra primera aventura juntos! 💕</small>
        </div>

        <footer class="notebook-footer">
          <button id="closeNotebookBtn" class="btn-close-notebook">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Cerrar cuaderno
          </button>
        </footer>

      </div><!-- /notebook-page -->
    </div><!-- /notebook -->
  </div><!-- /notebook-wrapper -->

  <!-- MODAL: Nueva / Editar cita -->
  <div id="citaModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close-btn" data-close="citaModal" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="modal-header">
        <span class="modal-icon">✍️</span>
        <h2 id="citaModalTitle">Nueva cita</h2>
      </div>
      <form id="citaForm">
        <div class="form-field">
          <label for="citaTitulo">Título de la cita</label>
          <input type="text" id="citaTitulo" placeholder="Ej: Cena bajo las estrellas" required>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="citaFecha">Fecha</label>
            <input type="date" id="citaFecha" required>
          </div>
          <div class="form-field">
            <label for="citaLugar">Lugar</label>
            <input type="text" id="citaLugar" placeholder="Ej: El mirador">
          </div>
        </div>
        <div class="form-field">
          <label for="citaDescripcion">¿Cómo fue?</label>
          <textarea id="citaDescripcion" rows="3" placeholder="Escribe lo que sentiste, lo que pasó..."></textarea>
        </div>
        <div class="form-field">
          <label>Color de la tarjeta</label>
          <div class="color-picker" id="colorPicker">
            <span class="color-dot" data-color="#FFB5C8" style="background:#FFB5C8" title="Rosa"></span>
            <span class="color-dot" data-color="#B5D8FF" style="background:#B5D8FF" title="Azul"></span>
            <span class="color-dot" data-color="#FFE4B5" style="background:#FFE4B5" title="Miel"></span>
            <span class="color-dot" data-color="#B5FFD8" style="background:#B5FFD8" title="Menta"></span>
            <span class="color-dot" data-color="#D8B5FF" style="background:#D8B5FF" title="Lavanda"></span>
            <span class="color-dot" data-color="#FFD4B5" style="background:#FFD4B5" title="Durazno"></span>
          </div>
        </div>
        <div class="form-field">
          <label>Fotos (opcional)</label>
          <label for="modalPhotoInput" class="btn-upload-modal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            Añadir fotos
          </label>
          <input type="file" id="modalPhotoInput" accept="image/*" multiple hidden>
          <div id="pendingPhotoPreview" class="pending-photo-preview"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" data-close="citaModal">Cancelar</button>
          <button type="submit" class="btn-save">Guardar cita ✓</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Detalle -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-card detail-card">
      <button class="modal-close-btn" data-close="detailModal" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="detail-banner" id="detailBanner">
        <h2 id="detailTitulo"></h2>
        <div class="detail-meta">
          <span id="detailFecha"></span>
          <span id="detailLugar"></span>
        </div>
      </div>
      <div class="detail-body">
        <p id="detailDescripcion"></p>
        <label for="photoInput" class="btn-upload">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
          Añadir fotos
        </label>
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
        <div id="photoGallery" class="photo-gallery"></div>
        <p id="galleryEmpty" class="empty-gallery">Todavía no hay fotos en esta cita.</p>
        <div class="detail-actions">
          <button id="editCitaBtn" class="btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
            Editar
          </button>
          <button id="deleteCitaBtn" class="btn-delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v6M14 11v6" />
              <path d="M9 6V4h6v2" />
            </svg>
            Eliminar cita
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-overlay"></div>
    <button class="lightbox-ctrl lightbox-close" aria-label="Cerrar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
    <button class="lightbox-ctrl lightbox-prev" aria-label="Anterior">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
    <img id="lightboxImg" src="" alt="Foto de la cita">
<button id="lightboxDownload" class="lightbox-ctrl" title="Descargar foto original">⬇️</button>
    <button class="lightbox-ctrl lightbox-next" aria-label="Siguiente">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
    <button id="lightboxDelete" class="lightbox-delete">🗑 Eliminar foto</button>
  </div>

  <script>
    document.getElementById("openNotebookBtn").addEventListener("click", () => {
      const cover = document.getElementById("coverPage");
      const page = document.getElementById("notebookPage");
      cover.style.animation = "coverFlip 0.6s ease forwards";
      setTimeout(() => {
        cover.classList.add("hidden");
        cover.style.animation = "";
        page.classList.remove("hidden");
        page.style.animation = "fadeSlideIn 0.5s ease forwards";
      }, 400);
    });

    document.getElementById("closeNotebookBtn").addEventListener("click", () => {
      const cover = document.getElementById("coverPage");
      const page = document.getElementById("notebookPage");
      page.style.animation = "fadeSlideOut 0.4s ease forwards";
      setTimeout(() => {
        page.classList.add("hidden");
        page.style.animation = "";
        cover.classList.remove("hidden");
        cover.style.animation = "coverOpen 0.5s ease forwards";
      }, 350);
    });
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
